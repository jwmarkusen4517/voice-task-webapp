<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Tasks</title>
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e3e0d8;
    --text: #232320;
    --text-dim: #6f6b60;
    --accent: #a8562f;
    --flag-bg: #fbeee4;
    --flag-border: #e3b48a;
    --flag-text: #96501f;
    --done-dim: #9a9990;
    --danger: #b8503f;
    --radius: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171613; --surface: #211f1b; --border: #363228;
      --text: #ece8e0; --text-dim: #a39c8e; --accent: #e08a5b;
      --flag-bg: #3a2c1c; --flag-border: #6b4a24; --flag-text: #e0a35f;
      --danger: #e08170;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171613; --surface: #211f1b; --border: #363228;
    --text: #ece8e0; --text-dim: #a39c8e; --accent: #e08a5b;
    --flag-bg: #3a2c1c; --flag-border: #6b4a24; --flag-text: #e0a35f;
    --danger: #e08170;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; font-weight: 700; }
  .sub { color: var(--text-dim); font-size: 0.85rem; }

  .tabs { display: flex; gap: 6px; margin: 18px 0 14px; border-bottom: 1px solid var(--border); }
  .tabs button {
    appearance: none; border: none; background: none; color: var(--text-dim);
    font-size: 0.85rem; font-weight: 600; padding: 8px 4px 10px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs .count {
    display: inline-block; margin-left: 5px; font-size: 0.72rem; font-weight: 700;
    background: var(--border); color: var(--text-dim); border-radius: 100px;
    padding: 1px 6px;
  }
  .tabs button.active .count { background: var(--accent); color: #fff; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px;
  }
  .card.flagged { border-color: var(--flag-border); background: var(--flag-bg); }
  .card.done { opacity: 0.5; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .title { font-weight: 600; font-size: 0.98rem; line-height: 1.35; }
  .card.done .title { text-decoration: line-through; }
  .flag-pill {
    flex-shrink: 0; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--flag-text); background: var(--flag-border);
    border-radius: 100px; padding: 2px 8px; white-space: nowrap;
  }
  .details { color: var(--text-dim); font-size: 0.85rem; margin-top: 5px; line-height: 1.4; }
  .note {
    margin-top: 8px; font-size: 0.82rem; color: var(--flag-text);
    background: rgba(0,0,0,0.03); border-radius: 8px; padding: 7px 10px;
  }
  .meta-row {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: 0.72rem;
    color: var(--text-dim);
  }
  .chip {
    border: 1px solid var(--border); border-radius: 100px; padding: 2px 9px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .raw-toggle {
    margin-top: 8px; font-size: 0.78rem; color: var(--accent); cursor: pointer;
    background: none; border: none; padding: 0; font-weight: 600;
  }
  .raw-text {
    margin-top: 6px; font-size: 0.82rem; color: var(--text-dim); font-style: italic;
    border-left: 2px solid var(--border); padding-left: 10px;
  }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button {
    font-size: 0.8rem; font-weight: 600; border-radius: 8px; padding: 6px 12px;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  .actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .actions button.dismiss { color: var(--danger); }
  .empty { text-align: center; color: var(--text-dim); padding: 40px 0; font-size: 0.9rem; }
  .status-line { text-align: center; color: var(--text-dim); font-size: 0.75rem; margin-top: 26px; }
  .err {
    background: var(--flag-bg); border: 1px solid var(--flag-border); color: var(--flag-text);
    border-radius: var(--radius); padding: 14px 16px; font-size: 0.85rem; line-height: 1.5;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Voice Tasks</h1>
    <div class="sub">Dictated tasks, matched and refined automatically.</div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="open">Open <span class="count" id="count-open">0</span></button>
    <button class="tab-btn" data-tab="flagged">Flagged <span class="count" id="count-flagged">0</span></button>
    <button class="tab-btn" data-tab="done">Done <span class="count" id="count-done">0</span></button>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>Nothing here.</div>
  <div class="status-line" id="statusLine">Loading…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var SUPABASE_URL = "https://dwneizmtvqxlmvjtkvmc.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_t-oTwDDUL8BSI9CyVkuJOw_ayBzWNi8";

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var listEl = document.getElementById("list");
  var emptyEl = document.getElementById("empty");
  var statusEl = document.getElementById("statusLine");
  var tabBtns = Array.prototype.slice.call(document.querySelectorAll(".tab-btn"));
  var currentTab = "open";
  var allTasks = [];

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function fmtDate(iso) {
    if (!iso) return "";
    try {
      return new Date(iso).toLocaleString(undefined, {
        month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
      });
    } catch (e) { return ""; }
  }

  function actionLabel(t) {
    if (t.action_taken === "created_event") return "Calendar event created";
    if (t.action_taken === "drafted_email") return "Email drafted";
    return null;
  }

  function render() {
    var open = allTasks.filter(function (t) { return t.status === "open" && t.confidence !== "uncertain"; });
    var flagged = allTasks.filter(function (t) { return t.status === "open" && t.confidence === "uncertain"; });
    var done = allTasks.filter(function (t) { return t.status !== "open"; });

    document.getElementById("count-open").textContent = open.length;
    document.getElementById("count-flagged").textContent = flagged.length;
    document.getElementById("count-done").textContent = done.length;

    var shown = currentTab === "open" ? open : currentTab === "flagged" ? flagged : done;

    emptyEl.hidden = shown.length !== 0;
    listEl.innerHTML = shown.map(renderCard).join("");

    Array.prototype.forEach.call(listEl.querySelectorAll("[data-done]"), function (btn) {
      btn.addEventListener("click", function () { setStatus(btn.getAttribute("data-done"), "done"); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-reopen]"), function (btn) {
      btn.addEventListener("click", function () { setStatus(btn.getAttribute("data-reopen"), "open"); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-dismiss]"), function (btn) {
      btn.addEventListener("click", function () { setStatus(btn.getAttribute("data-dismiss"), "dismissed"); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-raw-toggle]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-raw-toggle");
        var el = listEl.querySelector('[data-raw-text="' + id + '"]');
        if (el) el.hidden = !el.hidden;
        btn.textContent = el && !el.hidden ? "Hide original" : "Show original";
      });
    });
  }

  function renderCard(t) {
    var isFlagged = t.confidence === "uncertain" && t.status === "open";
    var isDone = t.status !== "open";
    var classes = "card" + (isFlagged ? " flagged" : "") + (isDone ? " done" : "");
    var action = actionLabel(t);

    var chips = [];
    if (t.due_date) chips.push('<span class="chip">Due ' + esc(fmtDate(t.due_date)) + '</span>');
    if (action) chips.push('<span class="chip">' + esc(action) + '</span>');
    chips.push('<span class="chip">' + esc(fmtDate(t.created_at)) + '</span>');

    var actionsHtml;
    if (t.status === "open") {
      actionsHtml =
        '<div class="actions">' +
          '<button class="primary" data-done="' + t.id + '">Mark done</button>' +
          '<button class="dismiss" data-dismiss="' + t.id + '">Dismiss</button>' +
        '</div>';
    } else {
      actionsHtml =
        '<div class="actions">' +
          '<button data-reopen="' + t.id + '">Reopen</button>' +
        '</div>';
    }

    return '' +
      '<div class="' + classes + '">' +
        '<div class="card-top">' +
          '<div class="title">' + esc(t.title) + '</div>' +
          (isFlagged ? '<span class="flag-pill">Flagged</span>' : '') +
        '</div>' +
        (t.details ? '<div class="details">' + esc(t.details) + '</div>' : '') +
        (isFlagged && t.confidence_note ? '<div class="note">' + esc(t.confidence_note) + '</div>' : '') +
        '<div class="meta-row">' + chips.join("") + '</div>' +
        '<button class="raw-toggle" data-raw-toggle="' + t.id + '">Show original</button>' +
        '<div class="raw-text" data-raw-text="' + t.id + '" hidden>' + esc(t.raw_transcript) + '</div>' +
        actionsHtml +
      '</div>';
  }

  function setStatus(id, status) {
    var idx = allTasks.findIndex(function (t) { return t.id === id; });
    if (idx !== -1) { allTasks[idx].status = status; render(); }
    sb.from("tasks").update({ status: status }).eq("id", id).then(function (res) {
      if (res.error) { statusEl.textContent = "Could not update: " + res.error.message; load(); }
    });
  }

  function load() {
    statusEl.textContent = "Loading…";
    sb.from("tasks").select("*").order("created_at", { ascending: false }).limit(200)
      .then(function (res) {
        if (res.error) {
          listEl.innerHTML = '';
          emptyEl.hidden = true;
          statusEl.textContent = "";
          listEl.innerHTML = '<div class="err">Could not load tasks: ' + esc(res.error.message) + '</div>';
          return;
        }
        allTasks = res.data || [];
        statusEl.textContent = "Synced " + new Date().toLocaleTimeString();
        render();
      });
  }

  tabBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      tabBtns.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      currentTab = btn.getAttribute("data-tab");
      render();
    });
  });

  load();

  sb.channel("tasks-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "tasks" }, function () { load(); })
    .subscribe();

  setInterval(load, 60000);
})();
</script>
</body>
</html>
