<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Tasks</title>
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e3e0d8;
    --text: #232320;
    --text-dim: #6f6b60;
    --accent: #a8562f;
    --pending-bg: #fbeee4;
    --pending-border: #e3b48a;
    --pending-text: #96501f;
    --pin-color: #c98a1f;
    --danger: #b8503f;
    --radius: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171613; --surface: #211f1b; --border: #363228;
      --text: #ece8e0; --text-dim: #a39c8e; --accent: #e08a5b;
      --pending-bg: #3a2c1c; --pending-border: #6b4a24; --pending-text: #e0a35f;
      --pin-color: #e0b35f;
      --danger: #e08170;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171613; --surface: #211f1b; --border: #363228;
    --text: #ece8e0; --text-dim: #a39c8e; --accent: #e08a5b;
    --pending-bg: #3a2c1c; --pending-border: #6b4a24; --pending-text: #e0a35f;
    --pin-color: #e0b35f;
    --danger: #e08170;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; font-weight: 700; }
  .sub { color: var(--text-dim); font-size: 0.85rem; }

  .list { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; position: relative;
  }
  .card.pending { border-color: var(--pending-border); background: var(--pending-bg); }
  .card.pinned { border-color: var(--pin-color); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .title-row { display: flex; align-items: center; gap: 6px; }
  .pin-icon { font-size: 0.9rem; line-height: 1; }
  .title { font-weight: 600; font-size: 0.98rem; line-height: 1.35; }
  .pending-pill {
    flex-shrink: 0; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--pending-text); background: var(--pending-border);
    border-radius: 100px; padding: 2px 8px; white-space: nowrap;
  }
  .details-line { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 6px; line-height: 1.4; }
  .note {
    margin-top: 8px; font-size: 0.82rem; color: var(--pending-text);
    background: rgba(0,0,0,0.03); border-radius: 8px; padding: 7px 10px;
  }
  .preview {
    margin-top: 8px; font-size: 0.82rem; color: var(--text); line-height: 1.4;
    background: var(--surface); border: 1px dashed var(--pending-border);
    border-radius: 8px; padding: 7px 10px;
  }
  .preview b { font-weight: 600; }
  .error-banner {
    margin-top: 8px; font-size: 0.8rem; color: var(--danger);
    background: rgba(184,80,63,0.08); border-radius: 8px; padding: 7px 10px;
  }
  .meta-row {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: 0.72rem;
    color: var(--text-dim);
  }
  .chip {
    border: 1px solid var(--border); border-radius: 100px; padding: 2px 9px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .raw-toggle {
    margin-top: 8px; font-size: 0.78rem; color: var(--accent); cursor: pointer;
    background: none; border: none; padding: 0; font-weight: 600;
  }
  .raw-text {
    margin-top: 6px; font-size: 0.82rem; color: var(--text-dim); font-style: italic;
    border-left: 2px solid var(--border); padding-left: 10px;
  }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button {
    font-size: 0.8rem; font-weight: 600; border-radius: 100px; padding: 6px 14px;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .actions button:disabled { opacity: 0.55; cursor: default; }
  .actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .actions button.danger { color: var(--danger); }
  .actions button.pin-btn.active { background: var(--pin-color); border-color: var(--pin-color); color: #fff; }
  .empty { text-align: center; color: var(--text-dim); padding: 40px 0; font-size: 0.9rem; }
  .status-line { text-align: center; color: var(--text-dim); font-size: 0.75rem; margin-top: 26px; }
  .err {
    background: var(--pending-bg); border: 1px solid var(--pending-border); color: var(--pending-text);
    border-radius: var(--radius); padding: 14px 16px; font-size: 0.85rem; line-height: 1.5;
  }
  .spinner {
    display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid currentColor; border-top-color: transparent;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Voice Tasks</h1>
    <div class="sub">Dictated tasks, matched and refined automatically.</div>
  </header>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>Nothing here.</div>
  <div class="status-line" id="statusLine">Loading…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var SUPABASE_URL = "https://dwneizmtvqxlmvjtkvmc.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_t-oTwDDUL8BSI9CyVkuJOw_ayBzWNi8";

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var listEl = document.getElementById("list");
  var emptyEl = document.getElementById("empty");
  var statusEl = document.getElementById("statusLine");
  var allTasks = [];
  var busyIds = {};   // task id -> true while confirm/delete/pin/done is in flight
  var errorIds = {};  // task id -> error message to show inline

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function fmtDate(iso) {
    if (!iso) return "";
    try {
      return new Date(iso).toLocaleString(undefined, {
        month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
      });
    } catch (e) { return ""; }
  }

  function fmtTimeOnly(iso) {
    if (!iso) return "";
    try {
      return new Date(iso).toLocaleString(undefined, { hour: "numeric", minute: "2-digit" });
    } catch (e) { return ""; }
  }

  function actionLabel(t) {
    if (t.action_taken === "created_event") return "Calendar event created";
    if (t.action_taken === "drafted_email") return "Email drafted";
    return null;
  }

  function pendingPreview(t) {
    var type = t.pending_action_type;
    var p = t.pending_action_params || {};
    if (type === "created_event") {
      var when = fmtDate(p.start);
      var endTime = fmtTimeOnly(p.end);
      return "Will create calendar event: <b>" + esc(p.summary || "(untitled)") + "</b>" +
        (when ? ", " + esc(when) + (endTime ? "–" + esc(endTime) : "") : "");
    }
    if (type === "drafted_email") {
      return "Will draft email to <b>" + esc(p.to || "?") + "</b>: " + esc(p.subject || "(no subject)");
    }
    return null;
  }

  function render() {
    var sorted = allTasks.slice().sort(function (a, b) {
      if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return new Date(b.created_at) - new Date(a.created_at);
    });

    emptyEl.hidden = sorted.length !== 0;
    listEl.innerHTML = sorted.map(renderCard).join("");

    Array.prototype.forEach.call(listEl.querySelectorAll("[data-pin]"), function (btn) {
      btn.addEventListener("click", function () { togglePin(btn.getAttribute("data-pin")); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-done]"), function (btn) {
      btn.addEventListener("click", function () { markDone(btn.getAttribute("data-done")); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-confirm]"), function (btn) {
      btn.addEventListener("click", function () { confirmTask(btn.getAttribute("data-confirm")); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-delete]"), function (btn) {
      btn.addEventListener("click", function () { deleteTask(btn.getAttribute("data-delete")); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-raw-toggle]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-raw-toggle");
        var el = listEl.querySelector('[data-raw-text="' + id + '"]');
        if (el) el.hidden = !el.hidden;
        btn.textContent = el && !el.hidden ? "Hide original" : "Show original";
      });
    });
  }

  function renderCard(t) {
    var isPending = t.confidence === "uncertain";
    var isPinned = !!t.pinned;
    var isBusy = !!busyIds[t.id];
    var classes = "card" + (isPending ? " pending" : "") + (isPinned ? " pinned" : "");
    var action = actionLabel(t);

    var chips = [];
    if (t.due_date) chips.push('<span class="chip">Due ' + esc(fmtDate(t.due_date)) + '</span>');
    if (action) chips.push('<span class="chip">' + esc(action) + '</span>');
    chips.push('<span class="chip">' + esc(fmtDate(t.created_at)) + '</span>');

    var preview = isPending ? pendingPreview(t) : null;
    var errMsg = errorIds[t.id];
    var hasExpand = !!(t.raw_transcript || t.details);

    var actionsHtml;
    if (isPending) {
      actionsHtml =
        '<div class="actions">' +
          '<button class="primary" data-confirm="' + t.id + '" ' + (isBusy ? "disabled" : "") + '>' +
            (isBusy ? '<span class="spinner"></span> Confirming…' : 'Confirm') +
          '</button>' +
          '<button class="danger" data-delete="' + t.id + '" ' + (isBusy ? "disabled" : "") + '>Delete</button>' +
        '</div>';
    } else {
      actionsHtml =
        '<div class="actions">' +
          '<button class="pin-btn' + (isPinned ? ' active' : '') + '" data-pin="' + t.id + '" ' + (isBusy ? "disabled" : "") + '>' +
            (isPinned ? '📌 Unpin' : '📌 Pin') +
          '</button>' +
          '<button data-done="' + t.id + '" ' + (isBusy ? "disabled" : "") + '>Mark done</button>' +
        '</div>';
    }

    return '' +
      '<div class="' + classes + '">' +
        '<div class="card-top">' +
          '<div class="title-row">' +
            (isPinned ? '<span class="pin-icon">📌</span>' : '') +
            '<div class="title">' + esc(t.title) + '</div>' +
          '</div>' +
          (isPending ? '<span class="pending-pill">Pending</span>' : '') +
        '</div>' +
        (isPending && t.confidence_note ? '<div class="note">' + esc(t.confidence_note) + '</div>' : '') +
        (preview ? '<div class="preview">' + preview + '</div>' : '') +
        (errMsg ? '<div class="error-banner">' + esc(errMsg) + '</div>' : '') +
        '<div class="meta-row">' + chips.join("") + '</div>' +
        (hasExpand ? '<button class="raw-toggle" data-raw-toggle="' + t.id + '">Show original</button>' : '') +
        (hasExpand ? '<div class="raw-text" data-raw-text="' + t.id + '" hidden>' +
          (t.details ? '<div class="details-line">' + esc(t.details) + '</div>' : '') +
          (t.raw_transcript ? esc(t.raw_transcript) : '') +
        '</div>' : '') +
        actionsHtml +
      '</div>';
  }

  function removeLocally(id) {
    allTasks = allTasks.filter(function (t) { return t.id !== id; });
    render();
  }

  function togglePin(id) {
    var idx = allTasks.findIndex(function (t) { return t.id === id; });
    if (idx === -1) return;
    var newVal = !allTasks[idx].pinned;
    allTasks[idx].pinned = newVal;
    render();
    sb.from("tasks").update({ pinned: newVal }).eq("id", id).then(function (res) {
      if (res.error) {
        allTasks[idx].pinned = !newVal;
        errorIds[id] = "Could not update pin: " + res.error.message;
        render();
      }
    });
  }

  function markDone(id) {
    busyIds[id] = true;
    render();
    sb.from("tasks").delete().eq("id", id).then(function (res) {
      delete busyIds[id];
      if (res.error) {
        errorIds[id] = "Could not mark done: " + res.error.message;
        render();
        return;
      }
      removeLocally(id);
    });
  }

  function deleteTask(id) {
    busyIds[id] = true;
    render();
    sb.from("tasks").delete().eq("id", id).then(function (res) {
      delete busyIds[id];
      if (res.error) {
        errorIds[id] = "Could not delete: " + res.error.message;
        render();
        return;
      }
      removeLocally(id);
    });
  }

  function confirmTask(id) {
    busyIds[id] = true;
    delete errorIds[id];
    render();
    sb.functions.invoke("voice-task", { body: { task_id: id } }).then(function (res) {
      delete busyIds[id];
      var data = res.data;
      var invokeErr = res.error;
      if (invokeErr || !data || data.ok === false) {
        errorIds[id] = "Couldn't create — try again" + ((data && data.error) ? (": " + data.error) : "");
        render();
        return;
      }
      // Success: replace the task locally with the server's updated copy
      // (confidence flips to "confident", pending fields clear, action_taken set).
      if (data.task) {
        var idx = allTasks.findIndex(function (t) { return t.id === id; });
        if (idx !== -1) allTasks[idx] = data.task;
      }
      render();
    }).catch(function (e) {
      delete busyIds[id];
      errorIds[id] = "Couldn't create — try again: " + String(e);
      render();
    });
  }

  function load() {
    statusEl.textContent = "Loading…";
    sb.from("tasks").select("*").order("created_at", { ascending: false }).limit(200)
      .then(function (res) {
        if (res.error) {
          listEl.innerHTML = '';
          emptyEl.hidden = true;
          statusEl.textContent = "";
          listEl.innerHTML = '<div class="err">Could not load tasks: ' + esc(res.error.message) + '</div>';
          return;
        }
        allTasks = res.data || [];
        statusEl.textContent = "Synced " + new Date().toLocaleTimeString();
        render();
      });
  }

  load();

  sb.channel("tasks-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "tasks" }, function () { load(); })
    .subscribe();

  setInterval(load, 60000);
})();
</script>
</body>
</html>
