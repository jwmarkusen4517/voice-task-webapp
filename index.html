<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Tasks</title>
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e3e0d8;
    --text: #232320;
    --text-dim: #6f6b60;
    --accent: #a8562f;
    --danger: #b8503f;
    --radius: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171613; --surface: #211f1b; --border: #363228;
      --text: #ece8e0; --text-dim: #a39c8e; --accent: #e08a5b;
      --danger: #e08170;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171613; --surface: #211f1b; --border: #363228;
    --text: #ece8e0; --text-dim: #a39c8e; --accent: #e08a5b;
    --danger: #e08170;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; font-weight: 700; }
  .sub { color: var(--text-dim); font-size: 0.85rem; }

  .list { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; position: relative;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .title { font-weight: 600; font-size: 0.98rem; line-height: 1.35; }
  .details-line { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 6px; line-height: 1.4; }
  .error-banner {
    margin-top: 8px; font-size: 0.8rem; color: var(--danger);
    background: rgba(184,80,63,0.08); border-radius: 8px; padding: 7px 10px;
  }
  .meta-row {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: 0.72rem;
    color: var(--text-dim);
  }
  .chip {
    border: 1px solid var(--border); border-radius: 100px; padding: 2px 9px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .raw-toggle {
    margin-top: 8px; font-size: 0.78rem; color: var(--accent); cursor: pointer;
    background: none; border: none; padding: 0; font-weight: 600;
  }
  .raw-text {
    margin-top: 6px; font-size: 0.82rem; color: var(--text-dim); font-style: italic;
    border-left: 2px solid var(--border); padding-left: 10px;
  }
  .actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .actions button {
    font-size: 0.8rem; font-weight: 600; border-radius: 100px; padding: 6px 14px;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .actions button:disabled { opacity: 0.4; cursor: default; }
  .order-btn { padding: 6px 10px !important; font-size: 0.9rem !important; line-height: 1; }
  .empty { text-align: center; color: var(--text-dim); padding: 40px 0; font-size: 0.9rem; }
  .status-line { text-align: center; color: var(--text-dim); font-size: 0.75rem; margin-top: 26px; }
  .err {
    background: var(--surface); border: 1px solid var(--border); color: var(--danger);
    border-radius: var(--radius); padding: 14px 16px; font-size: 0.85rem; line-height: 1.5;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Voice Tasks</h1>
    <div class="sub">Dictated tasks, cleaned up automatically.</div>
  </header>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>Nothing here.</div>
  <div class="status-line" id="statusLine">Loading…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var SUPABASE_URL = "https://dwneizmtvqxlmvjtkvmc.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_t-oTwDDUL8BSI9CyVkuJOw_ayBzWNi8";

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var listEl = document.getElementById("list");
  var emptyEl = document.getElementById("empty");
  var statusEl = document.getElementById("statusLine");
  var allTasks = [];
  var busyIds = {};   // task id -> true while an update is in flight
  var errorIds = {};  // task id -> error message to show inline

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function fmtDate(iso) {
    if (!iso) return "";
    try {
      return new Date(iso).toLocaleString(undefined, {
        month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
      });
    } catch (e) { return ""; }
  }

  function sortedTasks() {
    return allTasks.slice().sort(function (a, b) {
      return (b.position || 0) - (a.position || 0);
    });
  }

  function render() {
    var sorted = sortedTasks();

    emptyEl.hidden = sorted.length !== 0;
    listEl.innerHTML = sorted.map(function (t, i) {
      return renderCard(t, i === 0, i === sorted.length - 1);
    }).join("");

    Array.prototype.forEach.call(listEl.querySelectorAll("[data-up]"), function (btn) {
      btn.addEventListener("click", function () { moveTask(btn.getAttribute("data-up"), "up"); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-down]"), function (btn) {
      btn.addEventListener("click", function () { moveTask(btn.getAttribute("data-down"), "down"); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-done]"), function (btn) {
      btn.addEventListener("click", function () { markDone(btn.getAttribute("data-done")); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-raw-toggle]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-raw-toggle");
        var el = listEl.querySelector('[data-raw-text="' + id + '"]');
        if (el) el.hidden = !el.hidden;
        btn.textContent = el && !el.hidden ? "Hide original" : "Show original";
      });
    });
  }

  function renderCard(t, isFirst, isLast) {
    var isBusy = !!busyIds[t.id];
    var hasExpand = !!(t.raw_transcript || t.details);
    var errMsg = errorIds[t.id];

    var chips = [];
    if (t.due_date) chips.push('<span class="chip">Due ' + esc(fmtDate(t.due_date)) + '</span>');
    chips.push('<span class="chip">' + esc(fmtDate(t.created_at)) + '</span>');

    var actionsHtml =
      '<div class="actions">' +
        '<button class="order-btn" data-up="' + t.id + '" ' + (isBusy || isFirst ? "disabled" : "") + '>&#9650;</button>' +
        '<button class="order-btn" data-down="' + t.id + '" ' + (isBusy || isLast ? "disabled" : "") + '>&#9660;</button>' +
        '<button data-done="' + t.id + '" ' + (isBusy ? "disabled" : "") + '>Mark done</button>' +
      '</div>';

    return '' +
      '<div class="card">' +
        '<div class="card-top">' +
          '<div class="title">' + esc(t.title) + '</div>' +
        '</div>' +
        (errMsg ? '<div class="error-banner">' + esc(errMsg) + '</div>' : '') +
        '<div class="meta-row">' + chips.join("") + '</div>' +
        (hasExpand ? '<button class="raw-toggle" data-raw-toggle="' + t.id + '">Show original</button>' : '') +
        (hasExpand ? '<div class="raw-text" data-raw-text="' + t.id + '" hidden>' +
          (t.details ? '<div class="details-line">' + esc(t.details) + '</div>' : '') +
          (t.raw_transcript ? esc(t.raw_transcript) : '') +
        '</div>' : '') +
        actionsHtml +
      '</div>';
  }

  function removeLocally(id) {
    allTasks = allTasks.filter(function (t) { return t.id !== id; });
    render();
  }

  function moveTask(id, direction) {
    var sorted = sortedTasks();
    var idx = sorted.findIndex(function (t) { return t.id === id; });
    if (idx === -1) return;
    var neighborIdx = direction === "up" ? idx - 1 : idx + 1;
    if (neighborIdx < 0 || neighborIdx >= sorted.length) return;

    var a = sorted[idx];
    var b = sorted[neighborIdx];
    var aPos = a.position, bPos = b.position;

    // Swap positions locally for an instant reorder, then persist both rows.
    var aIdx = allTasks.findIndex(function (t) { return t.id === a.id; });
    var bIdx = allTasks.findIndex(function (t) { return t.id === b.id; });
    allTasks[aIdx].position = bPos;
    allTasks[bIdx].position = aPos;
    render();

    Promise.all([
      sb.from("tasks").update({ position: bPos }).eq("id", a.id),
      sb.from("tasks").update({ position: aPos }).eq("id", b.id),
    ]).then(function (results) {
      var failed = results.find(function (r) { return r.error; });
      if (failed) {
        // Revert on failure.
        allTasks[aIdx].position = aPos;
        allTasks[bIdx].position = bPos;
        errorIds[id] = "Could not reorder: " + failed.error.message;
        render();
      }
    });
  }

  function markDone(id) {
    busyIds[id] = true;
    render();
    sb.from("tasks").delete().eq("id", id).then(function (res) {
      delete busyIds[id];
      if (res.error) {
        errorIds[id] = "Could not mark done: " + res.error.message;
        render();
        return;
      }
      removeLocally(id);
    });
  }

  function load() {
    statusEl.textContent = "Loading…";
    sb.from("tasks").select("*").order("position", { ascending: false }).limit(200)
      .then(function (res) {
        if (res.error) {
          listEl.innerHTML = '';
          emptyEl.hidden = true;
          statusEl.textContent = "";
          listEl.innerHTML = '<div class="err">Could not load tasks: ' + esc(res.error.message) + '</div>';
          return;
        }
        allTasks = res.data || [];
        statusEl.textContent = "Synced " + new Date().toLocaleTimeString();
        render();
      });
  }

  load();

  sb.channel("tasks-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "tasks" }, function () { load(); })
    .subscribe();

  setInterval(load, 60000);
})();
</script>
</body>
</html>
