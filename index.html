<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Tasks</title>
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e3e0d8;
    --text: #232320;
    --text-dim: #6f6b60;
    --accent: #a8562f;
    --danger: #b8503f;
    --radius: 12px;

    --p1-solid: #c0392b;
    --p2-solid: #b7930f;
    --p3-solid: #3b6fb0;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171613; --surface: #211f1b; --border: #363228;
      --text: #ece8e0; --text-dim: #a39c8e; --accent: #e08a5b;
      --danger: #e08170;

      --p1-solid: #e0685a;
      --p2-solid: #d8bb56;
      --p3-solid: #6ea0e0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171613; --surface: #211f1b; --border: #363228;
    --text: #ece8e0; --text-dim: #a39c8e; --accent: #e08a5b;
    --danger: #e08170;

    --p1-solid: #e0685a;
    --p2-solid: #d8bb56;
    --p3-solid: #6ea0e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; font-weight: 700; }
  .sub { color: var(--text-dim); font-size: 0.85rem; }
  .stats {
    color: var(--text-dim); font-size: 0.78rem; margin-top: 8px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
  }
  .stats b { color: var(--text); font-weight: 700; }
  .stats .dot-1 { color: var(--p1-solid); font-weight: 700; }
  .stats .dot-2 { color: var(--p2-solid); font-weight: 700; }
  .stats .dot-3 { color: var(--p3-solid); font-weight: 700; }

  .section-label {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-dim); margin-top: 10px;
  }
  .section-label:first-child { margin-top: 0; }
  .section-label .dot-0 { color: var(--text-dim); }
  .section-label .dot-1 { color: var(--p1-solid); }
  .section-label .dot-2 { color: var(--p2-solid); }
  .section-label .dot-3 { color: var(--p3-solid); }

  .list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; position: relative;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .title-row { display: flex; align-items: flex-start; gap: 6px; flex: 1; min-width: 0; }
  .title { font-weight: 600; font-size: 0.98rem; line-height: 1.35; flex: 1; word-break: break-word; }
  .title-input {
    font-weight: 600; font-size: 0.98rem; line-height: 1.35; font-family: inherit;
    flex: 1; border: 1px solid var(--accent); border-radius: 6px; padding: 4px 6px;
    background: var(--surface); color: var(--text); min-width: 0;
  }
  .edit-btn {
    background: none; border: none; cursor: pointer; color: var(--text-dim);
    font-size: 0.85rem; padding: 2px 4px; flex-shrink: 0; line-height: 1;
  }
  .edit-btn:hover { color: var(--accent); }
  .title-save-row { display: flex; gap: 6px; margin-top: 6px; }
  .title-save-row button {
    font-size: 0.75rem; font-weight: 600; border-radius: 100px; padding: 4px 12px;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }

  .details-line { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 6px; line-height: 1.4; }
  .error-banner {
    margin-top: 8px; font-size: 0.8rem; color: var(--danger);
    background: rgba(184,80,63,0.08); border-radius: 8px; padding: 7px 10px;
  }
  .meta-row {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: 0.72rem;
    color: var(--text-dim);
  }
  .chip {
    border: 1px solid var(--border); border-radius: 100px; padding: 2px 9px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .raw-toggle {
    font-size: 0.72rem; color: var(--accent); cursor: pointer;
    background: none; border: none; padding: 0; font-weight: 600;
  }
  .raw-text {
    margin-top: 6px; font-size: 0.82rem; color: var(--text-dim); font-style: italic;
    border-left: 2px solid var(--border); padding-left: 10px;
  }

  .bottom-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-top: 12px; flex-wrap: wrap;
  }
  .priority-group { display: flex; align-items: center; gap: 6px; }
  .priority-label { font-size: 0.7rem; color: var(--text-dim); margin-right: 2px; }
  .priority-btn {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 1.5px solid var(--border); background: var(--surface); color: var(--text-dim);
    font-size: 0.72rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .priority-btn:disabled { opacity: 0.5; cursor: default; }
  .priority-btn.on-1 { color: var(--p1-solid); border-color: var(--p1-solid); background: var(--surface); }
  .priority-btn.on-2 { color: var(--p2-solid); border-color: var(--p2-solid); background: var(--surface); }
  .priority-btn.on-3 { color: var(--p3-solid); border-color: var(--p3-solid); background: var(--surface); }

  .actions { display: flex; align-items: center; gap: 8px; }
  .actions button {
    font-size: 0.8rem; font-weight: 600; border-radius: 100px; padding: 6px 14px;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .actions button:disabled { opacity: 0.4; cursor: default; }
  .empty { text-align: center; color: var(--text-dim); padding: 40px 0; font-size: 0.9rem; }
  .status-line { text-align: center; color: var(--text-dim); font-size: 0.75rem; margin-top: 26px; }
  .err {
    background: var(--surface); border: 1px solid var(--border); color: var(--danger);
    border-radius: var(--radius); padding: 14px 16px; font-size: 0.85rem; line-height: 1.5;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Voice Tasks</h1>
    <div class="sub">Dictated tasks, cleaned up automatically.</div>
    <div class="stats" id="statsRow"></div>
  </header>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>Nothing here.</div>
  <div class="status-line" id="statusLine">Loading…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var SUPABASE_URL = "https://dwneizmtvqxlmvjtkvmc.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_t-oTwDDUL8BSI9CyVkuJOw_ayBzWNi8";

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var listEl = document.getElementById("list");
  var emptyEl = document.getElementById("empty");
  var statusEl = document.getElementById("statusLine");
  var statsEl = document.getElementById("statsRow");
  var allTasks = [];
  var busyIds = {};    // task id -> true while an update is in flight
  var errorIds = {};   // task id -> error message to show inline
  var editingIds = {}; // task id -> draft title text while editing

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function fmtDate(iso) {
    if (!iso) return "";
    try {
      return new Date(iso).toLocaleString(undefined, {
        month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
      });
    } catch (e) { return ""; }
  }

  // Rank 0 = uncategorized (new, not yet triaged) so it always sorts first;
  // 1/2/3 are the priority levels.
  function priorityRank(p) {
    return p === 1 || p === 2 || p === 3 ? p : 0;
  }

  function sectionLabel(rank) {
    return rank === 0
      ? '<span class="dot-0">&#9679;</span> New / Uncategorized'
      : '<span class="dot-' + rank + '">&#9679;</span> Priority ' + rank;
  }

  // Grouped by priority (no priority first, then 1, 2, 3), and by position
  // (most recent first) within each group.
  function sortedTasks() {
    return allTasks.slice().sort(function (a, b) {
      var pr = priorityRank(a.priority) - priorityRank(b.priority);
      if (pr !== 0) return pr;
      return (b.position || 0) - (a.position || 0);
    });
  }

  function renderStats() {
    var counts = { 0: 0, 1: 0, 2: 0, 3: 0 };
    allTasks.forEach(function (t) { counts[priorityRank(t.priority)]++; });
    statsEl.innerHTML =
      '<span><b>' + allTasks.length + '</b> tasks</span>' +
      '<span>' + counts[0] + ' uncategorized</span>' +
      '<span class="dot-1">' + counts[1] + ' · 1</span>' +
      '<span class="dot-2">' + counts[2] + ' · 2</span>' +
      '<span class="dot-3">' + counts[3] + ' · 3</span>';
  }

  function render() {
    var sorted = sortedTasks();

    renderStats();
    emptyEl.hidden = sorted.length !== 0;

    var html = "";
    var lastRank = null;
    sorted.forEach(function (t) {
      var rank = priorityRank(t.priority);
      if (rank !== lastRank) {
        html += '<div class="section-label">' + sectionLabel(rank) + '</div>';
        lastRank = rank;
      }
      html += renderCard(t);
    });
    listEl.innerHTML = html;

    Array.prototype.forEach.call(listEl.querySelectorAll("[data-done]"), function (btn) {
      btn.addEventListener("click", function () { markDone(btn.getAttribute("data-done")); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-raw-toggle]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-raw-toggle");
        var el = listEl.querySelector('[data-raw-text="' + id + '"]');
        if (el) el.hidden = !el.hidden;
        btn.textContent = el && !el.hidden ? "Hide original" : "Show original";
      });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-priority]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-priority");
        var level = parseInt(btn.getAttribute("data-level"), 10);
        setPriority(id, level);
      });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-edit-title]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-edit-title");
        var t = allTasks.find(function (x) { return x.id === id; });
        editingIds[id] = t ? t.title : "";
        render();
        var input = listEl.querySelector('[data-title-input="' + id + '"]');
        if (input) { input.focus(); input.select(); }
      });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-title-input]"), function (input) {
      var id = input.getAttribute("data-title-input");
      input.addEventListener("input", function () { editingIds[id] = input.value; });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); saveTitle(id); }
        else if (e.key === "Escape") { e.preventDefault(); cancelTitleEdit(id); }
      });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-save-title]"), function (btn) {
      btn.addEventListener("click", function () { saveTitle(btn.getAttribute("data-save-title")); });
    });
    Array.prototype.forEach.call(listEl.querySelectorAll("[data-cancel-title]"), function (btn) {
      btn.addEventListener("click", function () { cancelTitleEdit(btn.getAttribute("data-cancel-title")); });
    });
  }

  function renderCard(t) {
    var isBusy = !!busyIds[t.id];
    var hasExpand = !!(t.raw_transcript || t.details);
    var errMsg = errorIds[t.id];
    var priority = priorityRank(t.priority) <= 3 ? t.priority : null;
    var isEditing = editingIds.hasOwnProperty(t.id);

    var chips = [];
    if (t.due_date) chips.push('<span class="chip">Due ' + esc(fmtDate(t.due_date)) + '</span>');
    chips.push('<span class="chip">' + esc(fmtDate(t.created_at)) + '</span>');
    if (hasExpand) chips.push('<button class="raw-toggle" data-raw-toggle="' + t.id + '">Show original</button>');

    var titleHtml;
    if (isEditing) {
      titleHtml =
        '<div class="title-row">' +
          '<input class="title-input" data-title-input="' + t.id + '" value="' + esc(editingIds[t.id]) + '">' +
        '</div>' +
        '<div class="title-save-row">' +
          '<button data-save-title="' + t.id + '">Save</button>' +
          '<button data-cancel-title="' + t.id + '">Cancel</button>' +
        '</div>';
    } else {
      titleHtml =
        '<div class="title-row">' +
          '<div class="title">' + esc(t.title) + '</div>' +
          '<button class="edit-btn" data-edit-title="' + t.id + '" ' + (isBusy ? "disabled" : "") + ' title="Edit title">&#9998;</button>' +
        '</div>';
    }

    var bottomRowHtml =
      '<div class="bottom-row">' +
        '<div class="priority-group">' +
          '<span class="priority-label">Priority</span>' +
          [1, 2, 3].map(function (level) {
            var on = priority === level ? " on-" + level : "";
            return '<button class="priority-btn' + on + '" data-priority="' + t.id + '" data-level="' + level + '" ' + (isBusy ? "disabled" : "") + '>' + level + '</button>';
          }).join("") +
        '</div>' +
        '<div class="actions">' +
          '<button data-done="' + t.id + '" ' + (isBusy ? "disabled" : "") + '>Done &#10003;</button>' +
        '</div>' +
      '</div>';

    return '' +
      '<div class="card">' +
        '<div class="card-top">' +
          titleHtml +
        '</div>' +
        (errMsg ? '<div class="error-banner">' + esc(errMsg) + '</div>' : '') +
        '<div class="meta-row">' + chips.join("") + '</div>' +
        (hasExpand ? '<div class="raw-text" data-raw-text="' + t.id + '" hidden>' +
          (t.details ? '<div class="details-line">' + esc(t.details) + '</div>' : '') +
          (t.raw_transcript ? esc(t.raw_transcript) : '') +
        '</div>' : '') +
        bottomRowHtml +
      '</div>';
  }

  function removeLocally(id) {
    allTasks = allTasks.filter(function (t) { return t.id !== id; });
    render();
  }

  function setPriority(id, level) {
    var idx = allTasks.findIndex(function (t) { return t.id === id; });
    if (idx === -1) return;
    var prevPriority = allTasks[idx].priority || null;
    // Clicking the already-active level clears it back to no priority.
    var nextPriority = prevPriority === level ? null : level;

    allTasks[idx].priority = nextPriority;
    render();

    sb.from("tasks").update({ priority: nextPriority }).eq("id", id).then(function (res) {
      if (res.error) {
        allTasks[idx].priority = prevPriority;
        errorIds[id] = "Could not set priority: " + res.error.message;
        render();
      }
    });
  }

  function cancelTitleEdit(id) {
    delete editingIds[id];
    render();
  }

  function saveTitle(id) {
    var draft = (editingIds[id] || "").trim();
    if (!draft) { cancelTitleEdit(id); return; }

    var idx = allTasks.findIndex(function (t) { return t.id === id; });
    var prevTitle = idx !== -1 ? allTasks[idx].title : null;
    if (idx !== -1) allTasks[idx].title = draft;
    delete editingIds[id];
    busyIds[id] = true;
    render();

    sb.from("tasks").update({ title: draft }).eq("id", id).then(function (res) {
      delete busyIds[id];
      if (res.error) {
        if (idx !== -1) allTasks[idx].title = prevTitle;
        errorIds[id] = "Could not save title: " + res.error.message;
      }
      render();
    });
  }

  function markDone(id) {
    busyIds[id] = true;
    render();
    sb.from("tasks").delete().eq("id", id).then(function (res) {
      delete busyIds[id];
      if (res.error) {
        errorIds[id] = "Could not mark done: " + res.error.message;
        render();
        return;
      }
      removeLocally(id);
    });
  }

  function load() {
    statusEl.textContent = "Loading…";
    sb.from("tasks").select("*").order("position", { ascending: false }).limit(200)
      .then(function (res) {
        if (res.error) {
          listEl.innerHTML = '';
          emptyEl.hidden = true;
          statusEl.textContent = "";
          listEl.innerHTML = '<div class="err">Could not load tasks: ' + esc(res.error.message) + '</div>';
          return;
        }
        allTasks = res.data || [];
        statusEl.textContent = "Synced " + new Date().toLocaleTimeString();
        render();
      });
  }

  load();

  sb.channel("tasks-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "tasks" }, function () { load(); })
    .subscribe();

  setInterval(load, 60000);
})();
</script>
</body>
</html>
